<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Bar by Bar</title>
<meta name="description" content="Colour in your piece, one bar at a time.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1C1E22">
<script>
  // Sets the theme before anything draws, so the app never flashes the wrong colours.
  (function () {
    var choice = 'auto';
    try { choice = localStorage.getItem('bar-theme') || 'auto'; } catch (e) {}
    var dark = choice === 'dark' || (choice === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    var root = document.documentElement;
    root.dataset.theme = dark ? 'dark' : 'light';
    root.dataset.choice = choice;
    document.querySelector('meta[name=theme-color]').content = dark ? '#1C1E22' : '#F7F7F4';
    document.querySelector('meta[name=color-scheme]').content = dark ? 'only dark' : 'only light';
  })();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/lexend.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<noscript>Bar by Bar needs JavaScript switched on.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
